# Studio: forklift + people keypoint annotation, one container.
#   docker compose up --build        then open http://localhost:8080; the first admin's password is in the
#   logs (docker compose logs app), or ADMIN_PASSWORD=<it> docker compose up sets it
#
# Persistent storage (keep both, back both up):
#   studio-db      /data/db       the SQLite database (users, annotations, campaigns, tasks, issues)
#   studio-images  /data/images   the batches: one folder per uploaded zip (also the uploads' temporary files)
# STUDIO_IMAGES=/some/host/folder puts the images in a host folder instead of the studio-images volume.
name: studio            # compose project name: the volumes are studio_studio-db and studio_studio-images
services:
  app:
    build: ./app
    environment:
      SECRET_KEY: ${SECRET_KEY:-}            # signs the sessions; empty: one generated and kept in studio-db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}    # the first admin's password (empty: random, printed in the logs)
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-5}     # biggest zip accepted
    volumes:
      - studio-db:/data/db
      - ${STUDIO_IMAGES:-studio-images}:/data/images
    ports:
      - "8080:8000"
    restart: unless-stopped

volumes:
  studio-db:
  studio-images:
